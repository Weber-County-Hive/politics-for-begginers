<title>Politics for Beginners | The Weber County Hive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');
:root{
  --bg:#0A0A0A; --surface:#141414; --surface-2:#1B1B1B;

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;line-height:1.6;}
.wrap{max-width:780px;margin:0 auto;padding:0 24px;}
header{border-bottom:4px solid var(--gold);padding:28px 0 22px;}
.brand{display:flex;align-items:center;gap:14px;}
.hex svg{width:40px;height:44px;}
.brand-text .h1{font-family:'Playfair Display',Georgia,serif;font-size:20px;color:var(--gold);letter-spacing:2px;}

.hero{padding:56px 0 40px;border-bottom:1px solid var(--line);}
.eyebrow{color:var(--gold);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(30px,6vw,44px);font-weight:700;color:var(--gold);line-height:1.2;}
.hero p{margin-top:18px;font-size:18px;color:var(--text-2);max-width:600px;}
.list{padding:40px 0;}
.item{
  display:block;
  border:1px solid var(--line);
  border-left:4px solid var(--line);
  padding:22px 24px;
  margin-bottom:14px;
  text-decoration:none;
  color:inherit;
  transition:border-color .15s, background .15s;
}
.item.ready{cursor:pointer;}
.item.ready:hover{border-left-color:var(--gold);background:var(--surface);}
.item.soon{opacity:.5;}
.item .num{font-size:12px;color:var(--gold-muted);letter-spacing:1px;margin-bottom:8px;}
